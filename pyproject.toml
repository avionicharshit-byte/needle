[project]
name = "san"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "jaxlib",
    "flax",
    "optax",
    "numpy",
    "datasets",
    "huggingface_hub",
    "wandb",
    "sentencepiece",
    "tqdm",
    "lm-eval",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]

[project.scripts]
san = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
